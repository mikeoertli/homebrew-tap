# brew tap-new uses this file to generate a PR test workflow for the new tap
name: brew test-bot

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-26 ]
        include:
          - os: ubuntu-latest
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }} # zizmor: ignore[unpinned-images]
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax
      - name: Set up Python for package selection
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Select public packages to build
        id: packages
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ -n "$BASE_SHA" ]]; then
            git fetch origin "$BASE_SHA" "$HEAD_SHA"
            python3 scripts/ci.py --base "$BASE_SHA" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            python3 scripts/ci.py >> "$GITHUB_OUTPUT"
          fi

      # Private-source packages are excluded by scripts/ci.py.
      - name: Build, test, and bottle changed public packages
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
        if: steps.packages.outputs.formulae != ''
        env:
          FORMULAE: ${{ steps.packages.outputs.formulae }}
          ADDED: ${{ steps.packages.outputs.added }}
        run: |
          args=(--only-formulae --testing-formulae="$FORMULAE")
          [[ -z "$ADDED" ]] || args+=(--added-formulae="$ADDED")
          brew test-bot "${args[@]}"

      - name: Upload bottles as artifact
        if: always() && steps.packages.outputs.formulae != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bottles_${{ matrix.os }}
          path: '${{ steps.set-up-homebrew.outputs.repository-path }}/*.bottle.*'
